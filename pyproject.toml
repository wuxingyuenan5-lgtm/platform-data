[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-data"
version = "0.1.0"
description = "Market data pipeline for platform dashboards"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1,<2",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "requests>=2.31"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
