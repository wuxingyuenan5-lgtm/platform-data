name: macro-data

on:
  workflow_dispatch:
  push:
    paths:
      - "src/platform_data/**"
      - "tests/**"
      - "config/macro_series.yaml"
      - "pyproject.toml"
      - ".github/workflows/macro-data.yml"
  schedule:
    # 01:30 UTC Tue-Sat captures the prior U.S. business-day Treasury close.
    - cron: "30 1 * * 2-6"

permissions:
  contents: write

concurrency:
  group: platform-data-macro-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipeline
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Unit tests
        run: python -m pytest -q

      - name: Refresh U.S. Treasury market tenors
        run: |
          python -m platform_data.cli refresh-treasury-market-tenors
          python -m platform_data.cli refresh-fred-macro-core
          python -m platform_data.cli refresh-yahoo-macro-market
          python -m platform_data.cli build-macro-market-detail

      - name: Commit material data changes only
        shell: bash
        run: |
          git add public/v1/macro/series/ public/v1/macro/market-detail.json history/us_treasury_2y/ history/us_treasury_10y/ history/us_treasury_30y/
          if git diff --cached --quiet; then
            echo "No material Treasury data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh U.S. Treasury 10Y"
          git push
