name: crypto-data

on:
  workflow_dispatch:
  push:
    paths:
      - "src/platform_data/providers/binance.py"
      - "src/platform_data/pipelines/binance_crypto.py"
      - "src/platform_data/pipelines/crypto_dashboard.py"
      - "tests/test_binance.py"
      - "tests/test_crypto_dashboard.py"
      - ".github/workflows/crypto-data.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: platform-data-crypto-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pipeline
        run: python -m pip install -e . pytest
      - name: Unit tests
        run: python -m pytest -q
      - name: Refresh Binance Crypto core
        run: |
          python -m platform_data.cli refresh-binance-crypto-core
          python -m platform_data.cli build-crypto-dashboard
      - name: Commit material data changes only
        shell: bash
        run: |
          git add public/v1/crypto/
          if git diff --cached --quiet; then
            echo "No material Crypto data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh Binance Crypto core"
          git pull --rebase origin main
          git push
