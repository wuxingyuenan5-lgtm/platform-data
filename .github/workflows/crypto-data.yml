name: crypto-code-ci

on:
  push:
    paths:
      - "src/platform_data/providers/binance.py"
      - "src/platform_data/pipelines/binance_crypto.py"
      - "src/platform_data/pipelines/crypto_dashboard.py"
      - "tests/test_binance.py"
      - "tests/test_crypto_dashboard.py"
      - "src/platform_data/cli.py"
      - "src/platform_data/local_database.py"
      - "tests/test_local_database.py"
      - "pyproject.toml"
      - ".github/workflows/crypto-data.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pipeline
        run: python -m pip install -e . pytest
      - name: Unit tests
        run: python -m pytest -q
