name: commodity-code-ci

on:
  push:
    paths:
      - "src/platform_data/providers/cftc.py"
      - "src/platform_data/providers/eia.py"
      - "src/platform_data/pipelines/cftc_commodity.py"
      - "src/platform_data/pipelines/commodity_dashboard.py"
      - "src/platform_data/pipelines/eia_commodity.py"
      - "tests/test_cftc.py"
      - "tests/test_commodity_dashboard.py"
      - "tests/test_eia.py"
      - "src/platform_data/cli.py"
      - "src/platform_data/local_database.py"
      - "tests/test_local_database.py"
      - "pyproject.toml"
      - ".github/workflows/commodity-data.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pipeline
        run: python -m pip install -e . pytest
      - name: Unit tests
        run: python -m pytest -q
