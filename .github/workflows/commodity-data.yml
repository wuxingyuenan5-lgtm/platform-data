name: commodity-data

on:
  workflow_dispatch:
  push:
    paths:
      - "src/platform_data/providers/cftc.py"
      - "src/platform_data/pipelines/cftc_commodity.py"
      - "src/platform_data/pipelines/commodity_dashboard.py"
      - "tests/test_cftc.py"
      - "tests/test_commodity_dashboard.py"
      - ".github/workflows/commodity-data.yml"
  schedule:
    - cron: "30 12 * * 6"

permissions:
  contents: write

concurrency:
  group: platform-data-commodity-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pipeline
        run: python -m pip install -e . pytest
      - name: Unit tests
        run: python -m pytest -q
      - name: Refresh CFTC commodity positioning
        run: |
          python -m platform_data.cli refresh-cftc-commodity-core
          python -m platform_data.cli build-commodity-dashboard
      - name: Commit material data changes only
        shell: bash
        run: |
          git add public/v1/commodity/series/ public/v1/commodity/dashboard.json
          if git diff --cached --quiet; then
            echo "No material CFTC data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh CFTC commodity positioning"
          git pull --rebase origin main
          git push
